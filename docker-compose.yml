services:
  postgres:
    image: postgres:16-alpine
    container_name: hiplatform_db
    environment:
      POSTGRES_USER: hiplatform
      POSTGRES_PASSWORD: hiplatform_dev
      POSTGRES_DB: hiplatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    container_name: hiplatform_api
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://hiplatform:hiplatform_dev@postgres:5432/hiplatform
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./apps/web
    container_name: hiplatform_web
    env_file: ./apps/web/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
