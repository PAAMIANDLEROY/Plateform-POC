services:
  mongodb:
    image: mongo:7
    container_name: hiplatform_db
    environment:
      MONGO_INITDB_DATABASE: hiplatform
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    container_name: hiplatform_api
    env_file: ./apps/api/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017/hiplatform
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      mongodb:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./apps/web
    container_name: hiplatform_web
    env_file: ./apps/web/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

volumes:
  mongo_data:
